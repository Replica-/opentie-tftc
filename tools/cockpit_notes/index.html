<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: craft tabs and drawing tools on top, OpenTIE and TFTC side by side, the message and what was sent below. */
:root {
  --bg: #e9ebee; --panel: #f6f7f9; --line: #c9ced6; --fg: #15191f; --muted: #5d6673;
  --accent: #c2410c; --accent-fg: #fff; --done: #2f7d4a;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #101317; --panel: #171b21; --line: #2a313b; --fg: #e6e9ee; --muted: #8d97a5;
  --accent: #ff7a3d; --accent-fg: #160b04; --done: #5cc58a; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body) }
.wrap { padding: 16px; display: grid; gap: 14px }
h1 { font: 600 22px/1.2 var(--display); letter-spacing: .02em; margin: 0 }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px }
.hint { color: var(--muted); margin: 0 }
.label { font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.tabs { display: flex; flex-wrap: wrap; gap: 6px }
.tab { font: 500 13px var(--body); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); cursor: pointer }
.tab[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.tab small { color: var(--muted); font: 11px var(--mono); margin-left: 6px }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel) }
.group { display: inline-flex; gap: 4px; align-items: center }
.tool { font: 500 12px var(--body); padding: 5px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer }
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0 }
.swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset }
input[type=range] { width: 90px }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 900px) { .panes { grid-template-columns: 1fr } }
.pane { display: grid; gap: 4px; min-width: 0 }
.surface { position: relative; border-radius: 6px; overflow: hidden; background: #000; touch-action: none; cursor: crosshair }
.surface img { display: block; width: 100%; pointer-events: none; user-select: none }
.surface canvas { position: absolute; inset: 0; width: 100%; height: 100% }
.compose { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start }
@media (max-width: 900px) { .compose { grid-template-columns: 1fr } }
textarea { width: 100%; min-height: 90px; resize: vertical; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { font: 600 13px var(--body); padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.btn:disabled { opacity: .55; cursor: default }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.msg { color: var(--muted); font-size: 13px }
.sent { display: grid; gap: 8px; max-height: 420px; overflow: auto }
.item { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel) }
.item img { width: 96px; border-radius: 3px; background: #000 }
.item p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 13px }
.item .meta { font: 11px var(--mono); color: var(--muted) }
.item.read .meta b { color: var(--done) }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Cockpit Notes</h1>
    <p class="hint">Draw on either capture, write what you want changed, and send it. Claude is woken by each message and answers in the chat.</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <div class="group" role="group" aria-label="Tool">
      <button class="tool" data-tool="pen" aria-pressed="true">Paint</button>
      <button class="tool" data-tool="line" aria-pressed="false">Line</button>
      <button class="tool" data-tool="arrow" aria-pressed="false">Arrow</button>
      <button class="tool" data-tool="box" aria-pressed="false">Box</button>
    </div>
    <div class="group" role="group" aria-label="Colour" id="colours"></div>
    <label class="group"><span class="label">Width</span><input type="range" id="width" min="2" max="24" value="6"></label>
    <div class="group">
      <button class="tool" id="undo" title="Ctrl+Z">Undo</button>
      <button class="tool" id="clear">Clear marks</button>
      <button class="tool" id="recapture">Capture again</button>
    </div>
    <span class="msg" id="status"></span>
  </div>
  <div class="panes">
    <div class="pane"><span class="label" id="oursLabel">OpenTIE</span><div class="surface" id="paneOurs"><img id="imgOurs" alt="OpenTIE capture"><canvas id="cvOurs"></canvas></div></div>
    <div class="pane"><span class="label">TFTC</span><div class="surface" id="paneTftc"><img id="imgTftc" alt="TFTC screenshot"><canvas id="cvTftc"></canvas></div></div>
  </div>
  <div class="compose">
    <div style="display:grid;gap:8px">
      <label class="label" for="text">Message to Claude</label>
      <textarea id="text" placeholder="e.g. the orange line marks a flap sticking out past the screen; remove it"></textarea>
      <div class="row"><button class="btn primary" id="send">Send to Claude</button><span class="msg">Ctrl+Enter sends. Your marks on both captures go with it.</span></div>
    </div>
    <div style="display:grid;gap:8px">
      <span class="label">Sent</span>
      <div class="sent" id="sent"><div class="msg">Nothing sent yet.</div></div>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COLOURS = ["#ff6a1a", "#ff2d2d", "#ffd400", "#2fd4ff", "#ffffff"];
  let shots = [], inbox = [], current = null, tool = "pen", colour = COLOURS[0];
  const marks = {}; // craft -> { ours: [...], tftc: [...] }
  let drawing = null;
  try { current = localStorage.getItem("cockpitNotes.shot"); } catch (e) {}
  const api = async (method, url, body) => {
    const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok && r.status !== 202) throw new Error("HTTP " + r.status);
    return r.json();
  };
  const shot = () => shots.find((s) => s.id === current);
  const marksFor = () => (marks[current] ||= { ours: [], tftc: [] });
  const panes = {
    ours: { img: $("imgOurs"), cv: $("cvOurs"), surface: $("paneOurs") },
    tftc: { img: $("imgTftc"), cv: $("cvTftc"), surface: $("paneTftc") },
  };

  COLOURS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "swatch"; b.style.background = c; b.setAttribute("aria-label", "Colour " + (i + 1));
    b.setAttribute("aria-pressed", String(c === colour));
    b.onclick = () => { colour = c; document.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", String(s === b))); };
    $("colours").append(b);
  });
  document.querySelectorAll("[data-tool]").forEach((b) => b.onclick = () => {
    tool = b.dataset.tool;
    document.querySelectorAll("[data-tool]").forEach((t) => t.setAttribute("aria-pressed", String(t === b)));
  });

  // Marks are kept in image pixels, so they draw the same at any size and on the sent image.
  function drawMark(ctx, m, scale = 1) {
    ctx.save();
    ctx.strokeStyle = m.colour; ctx.fillStyle = m.colour;
    ctx.lineWidth = m.width * scale; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const p = m.points.map(([x, y]) => [x * scale, y * scale]);
    ctx.beginPath();
    if (m.tool === "pen") {
      p.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      if (p.length === 1) ctx.lineTo(p[0][0] + 0.1, p[0][1]);
      ctx.stroke();
    } else if (m.tool === "box") {
      const [[x0, y0], [x1, y1]] = [p[0], p[p.length - 1]];
      ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    } else {
      const [[x0, y0], [x1, y1]] = [p[0], p[p.length - 1]];
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      if (m.tool === "arrow") {
        const a = Math.atan2(y1 - y0, x1 - x0), head = Math.max(14, m.width * 3.5) * scale;
        ctx.beginPath(); ctx.moveTo(x1, y1);
        ctx.lineTo(x1 - head * Math.cos(a - 0.45), y1 - head * Math.sin(a - 0.45));
        ctx.lineTo(x1 - head * Math.cos(a + 0.45), y1 - head * Math.sin(a + 0.45));
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  function redraw(side) {
    const { img, cv } = panes[side];
    if (!img.naturalWidth) return;
    if (cv.width !== img.naturalWidth) { cv.width = img.naturalWidth; cv.height = img.naturalHeight; }
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    const list = marksFor()[side].slice();
    if (drawing && drawing.side === side) list.push(drawing.mark);
    list.forEach((m) => drawMark(ctx, m));
  }
  const redrawAll = () => { redraw("ours"); redraw("tftc"); };

  for (const side of ["ours", "tftc"]) {
    const { surface, img, cv } = panes[side];
    img.onload = () => redraw(side);
    const at = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    surface.addEventListener("pointerdown", (e) => {
      if (!img.naturalWidth) return;
      surface.setPointerCapture(e.pointerId);
      const width = Number($("width").value) * img.naturalWidth / 1600;
      drawing = { side, mark: { tool, colour, width, points: [at(e)] } };
      redraw(side);
    });
    surface.addEventListener("pointermove", (e) => {
      if (!drawing || drawing.side !== side) return;
      const p = at(e);
      if (drawing.mark.tool === "pen") drawing.mark.points.push(p); else drawing.mark.points[1] = p;
      redraw(side);
    });
    surface.addEventListener("pointerup", () => {
      if (!drawing || drawing.side !== side) return;
      marksFor()[side].push(drawing.mark); drawing = null; redraw(side);
    });
  }
  const undo = () => {
    // The most recent mark, on whichever capture it was drawn.
    const m = marksFor();
    let side = m.lastSide; if (!side || !m[side].length) side = m.ours.length ? "ours" : "tftc";
    m[side].pop(); redrawAll();
  };
  for (const side of ["ours", "tftc"]) panes[side].surface.addEventListener("pointerup", () => { marksFor().lastSide = side; });
  $("undo").onclick = undo;
  document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && document.activeElement !== $("text")) { e.preventDefault(); undo(); } });
  $("clear").onclick = () => { marks[current] = { ours: [], tftc: [] }; redrawAll(); };

  function renderTabs() {
    const el = $("tabs"); el.textContent = "";
    for (const s of shots) {
      const b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.setAttribute("aria-pressed", String(s.id === current));
      b.textContent = s.title;
      const n = (marks[s.id]?.ours.length || 0) + (marks[s.id]?.tftc.length || 0);
      if (s.capture === "running" || n) { const sm = document.createElement("small"); sm.textContent = s.capture === "running" ? "capturing" : n + " marks"; b.append(sm); }
      b.onclick = () => { current = s.id; try { localStorage.setItem("cockpitNotes.shot", current); } catch (e) {} renderAll(); };
      el.append(b);
    }
  }
  function renderPanes() {
    const s = shot(); if (!s) return;
    $("oursLabel").textContent = "OpenTIE · " + s.mission + (s.taken ? " · captured " + s.taken : "");
    if (s.ours && panes.ours.img.getAttribute("src") !== s.ours) panes.ours.img.src = s.ours;
    if (s.tftc && panes.tftc.img.getAttribute("src") !== s.tftc) panes.tftc.img.src = s.tftc;
    const busy = s.capture === "running";
    $("recapture").disabled = busy; $("recapture").textContent = busy ? "Capturing… (about 20 s)" : "Capture again";
    if (s.capture && !busy) $("status").textContent = s.capture;
    redrawAll();
  }
  function renderSent() {
    const el = $("sent"); el.textContent = "";
    if (!inbox.length) { el.innerHTML = '<div class="msg">Nothing sent yet.</div>'; return; }
    for (const m of inbox) {
      const it = document.createElement("div"); it.className = "item" + (m.status === "read" ? " read" : "");
      const img = document.createElement("img"); img.alt = ""; if (m.image) img.src = "/inbox/" + m.image;
      const body = document.createElement("div");
      const meta = document.createElement("div"); meta.className = "meta";
      meta.innerHTML = "<b></b>"; meta.firstChild.textContent = m.status === "read" ? "Claude read it" : "Sent, waiting for Claude";
      meta.append(" · " + m.craft + " · " + m.sentAt.slice(11, 16));
      const p = document.createElement("p"); p.textContent = m.text || "(no message)";
      body.append(meta, p); it.append(img, body); el.append(it);
    }
  }
  const renderAll = () => { renderTabs(); renderPanes(); renderSent(); };

  async function refresh() {
    try {
      [shots, inbox] = await Promise.all([api("GET", "/api/shots"), api("GET", "/api/inbox")]);
      if (!shots.some((s) => s.id === current)) current = shots[0] && shots[0].id;
      if (!drawing) renderAll();
    } catch (e) { $("status").textContent = "The notes server isn't answering. Start it with python tools/cockpit_notes/server.py"; }
  }

  // The sent image: both captures side by side at OpenTIE's height, marks drawn in.
  function compose() {
    const a = panes.ours.img, b = panes.tftc.img, m = marksFor();
    const h = a.naturalHeight || 1080, wa = a.naturalWidth ? a.naturalWidth : 0;
    const sb = b.naturalHeight ? h / b.naturalHeight : 0, wb = b.naturalWidth * sb;
    const cv = document.createElement("canvas"); cv.width = Math.round(wa + wb); cv.height = h;
    const ctx = cv.getContext("2d");
    if (wa) { ctx.drawImage(a, 0, 0); m.ours.forEach((k) => drawMark(ctx, k)); }
    if (wb) { ctx.save(); ctx.translate(wa, 0); ctx.drawImage(b, 0, 0, wb, h); m.tftc.forEach((k) => drawMark(ctx, k, sb)); ctx.restore(); }
    return cv.toDataURL("image/jpeg", 0.85);
  }
  $("send").onclick = async () => {
    const text = $("text").value.trim(), m = marksFor();
    if (!text && !m.ours.length && !m.tftc.length) { $("status").textContent = "Draw something or write a message first."; return; }
    $("send").disabled = true; $("status").textContent = "Sending…";
    try {
      await api("POST", "/api/send", { shot: current, text, marks: m.ours.length + m.tftc.length, image: compose() });
      $("text").value = ""; marks[current] = { ours: [], tftc: [] }; $("status").textContent = "Sent. Claude will answer in the chat.";
    } catch (e) { $("status").textContent = "Couldn't send: is the server running?"; }
    $("send").disabled = false; refresh();
  };
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("send").click(); });
  $("recapture").onclick = async () => { $("status").textContent = ""; try { await api("POST", "/api/capture/" + current); } catch (e) {} refresh(); };

  refresh();
  setInterval(() => { if (!drawing) refresh(); }, 3000);
})();
</script>
</body>
</html>
