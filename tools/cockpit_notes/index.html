<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: craft rail on the left, OpenTIE's capture to mark up with TFTC's beneath, the craft's notes on the right. */
:root {
  --bg: #e9ebee; --panel: #f6f7f9; --line: #c9ced6; --fg: #15191f; --muted: #5d6673;
  --accent: #c2410c; --accent-fg: #fff; --mark: #e8590c; --done: #2f7d4a;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #101317; --panel: #171b21; --line: #2a313b; --fg: #e6e9ee; --muted: #8d97a5;
  --accent: #ff7a3d; --accent-fg: #160b04; --mark: #ff8a4c; --done: #5cc58a; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body) }
.wrap { padding: 16px; display: grid; gap: 16px }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px }
h1 { font: 600 22px/1.2 var(--display); letter-spacing: .02em; margin: 0 }
.hint { color: var(--muted); margin: 0; max-width: 75ch }
.grid { display: grid; grid-template-columns: 200px minmax(0, 1fr) 320px; gap: 16px; align-items: start }
@media (max-width: 1100px) { .grid { grid-template-columns: 170px minmax(0, 1fr) } .notes { grid-column: 1 / -1 } }
@media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.rail, .notes, .stage { display: grid; gap: 8px; min-width: 0 }
.label { font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.shot { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; font: inherit; text-align: left; cursor: pointer }
.shot img { width: 64px; aspect-ratio: 16/9; object-fit: cover; border-radius: 3px; background: #000 }
.shot[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.shot b { font-weight: 600; display: block }
.shot small { color: var(--muted); font: 12px var(--mono) }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.bar .label { margin-right: auto }
.canvas { position: relative; border-radius: 6px; overflow: hidden; background: #000; touch-action: none; user-select: none; cursor: crosshair }
.canvas img { display: block; width: 100%; pointer-events: none }
.ref img { display: block; width: 100%; border-radius: 6px }
.box { position: absolute; border: 2px solid var(--mark); background: rgba(232, 89, 12, .12); border-radius: 2px }
.box.done { border-color: var(--done); background: transparent; border-style: dashed }
.box.draft { border-style: dashed }
.box.active { box-shadow: 0 0 0 3px rgba(255,255,255,.6) }
.tag { position: absolute; top: -2px; left: -2px; transform: translateY(-100%); background: var(--mark); color: #120700; font: 600 12px/1 var(--mono); padding: 3px 5px; border-radius: 3px 3px 0 0 }
.box.done .tag { background: var(--done) }
.composer { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--accent); border-radius: 6px; background: var(--panel) }
textarea { width: 100%; min-height: 70px; resize: vertical; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
button.btn { font: 600 13px var(--body); padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
button.btn:disabled { opacity: .55; cursor: default }
button:focus-visible, .shot:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.note { display: grid; gap: 4px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel) }
.note.active { border-color: var(--mark) }
.note header { display: flex; gap: 8px; align-items: center }
.num { font: 600 12px var(--mono); color: #120700; background: var(--mark); border-radius: 3px; padding: 1px 6px }
.note.isdone .num { background: var(--done) }
.status { margin-left: auto; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.note.isdone .status { color: var(--done) }
.note p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap }
.reply { border-left: 2px solid var(--done); padding-left: 8px; color: var(--muted) }
.links button { font: 500 12px var(--body); background: none; border: none; color: var(--muted); padding: 0; cursor: pointer; text-decoration: underline }
.msg { color: var(--muted); font-size: 13px }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden }
.toggle button { font: 500 12px var(--body); padding: 5px 10px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Cockpit Notes</h1>
    <p class="hint">Pick a craft, drag a box over anything that looks wrong on OpenTIE's capture, and say what you want changed. Notes save to <code>docs/tftc_reference/notes.json</code>, where Claude reads them and replies.</p>
  </header>
  <div class="grid">
    <aside class="rail">
      <span class="label">Craft</span>
      <div id="shots" class="rail"><div class="msg">Loading…</div></div>
    </aside>
    <main class="stage">
      <div class="bar">
        <span class="label" id="title"></span>
        <div class="toggle" role="group" aria-label="Show">
          <button type="button" id="showOurs" aria-pressed="true">OpenTIE</button>
          <button type="button" id="showTftc" aria-pressed="false">TFTC</button>
        </div>
        <button class="btn" id="recapture" type="button">Capture again</button>
      </div>
      <div id="canvas" class="canvas"><img id="img" alt="OpenTIE capture"></div>
      <div id="composer" class="composer" hidden>
        <label for="text" class="label">What's wrong in this box?</label>
        <textarea id="text" placeholder="e.g. this flap sticks out past the screen edge"></textarea>
        <div class="row"><button class="btn primary" id="save" type="button">Save note</button><button class="btn" id="cancel" type="button">Cancel</button><span class="msg" id="saveMsg"></span></div>
      </div>
      <span class="label">TFTC for comparison</span>
      <div class="ref"><img id="ref" alt="TFTC screenshot"></div>
    </main>
    <section class="notes">
      <span class="label" id="notesLabel">Notes</span>
      <div id="notes" class="notes"></div>
    </section>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let shots = [], notes = [], current = null, draft = null, activeNote = null, showTftc = false;
  try { current = localStorage.getItem("cockpitNotes.shot"); } catch (e) {}
  const pct = (v) => (v * 100).toFixed(3) + "%";
  const api = async (method, url, body) => {
    const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok && r.status !== 202) throw new Error("HTTP " + r.status);
    return r.json();
  };
  const shot = () => shots.find((s) => s.id === current);

  function renderShots() {
    const el = $("shots"); el.textContent = "";
    for (const s of shots) {
      const b = document.createElement("button");
      b.className = "shot"; b.type = "button";
      b.setAttribute("aria-current", s.id === current ? "true" : "false");
      const img = document.createElement("img"); img.alt = ""; if (s.ours) img.src = s.ours;
      const t = document.createElement("span");
      const name = document.createElement("b"); name.textContent = s.title;
      const open = notes.filter((n) => n.shot === s.id && n.status !== "done").length;
      const sm = document.createElement("small"); sm.textContent = s.capture === "running" ? "capturing…" : open ? open + " open" : s.mission;
      t.append(name, sm); b.append(img, t);
      b.onclick = () => { current = s.id; draft = null; try { localStorage.setItem("cockpitNotes.shot", current); } catch (e) {} renderAll(); };
      el.append(b);
    }
  }

  function renderStage() {
    const s = shot(); if (!s) return;
    $("title").textContent = s.title + " · " + s.mission + (s.taken ? " · captured " + s.taken : "");
    const src = showTftc ? s.tftc : s.ours;
    const img = $("img");
    if (src && img.getAttribute("src") !== src) img.src = src;
    img.alt = showTftc ? "TFTC screenshot" : "OpenTIE capture";
    if (s.tftc && $("ref").getAttribute("src") !== s.tftc) $("ref").src = s.tftc;
    const c = $("canvas");
    c.querySelectorAll(".box").forEach((b) => b.remove());
    if (!showTftc) {
      notes.filter((n) => n.shot === s.id).forEach((n, i) => c.append(boxEl(n, i + 1)));
      if (draft) c.append(boxEl(draft, "+", true));
    }
    $("composer").hidden = !draft;
    const busy = s.capture === "running";
    $("recapture").disabled = busy;
    $("recapture").textContent = busy ? "Capturing… (about 20 s)" : "Capture again";
    $("saveMsg").textContent = s.capture && !busy ? s.capture : $("saveMsg").textContent;
  }

  function boxEl(n, label, isDraft) {
    const b = document.createElement("div");
    b.className = "box" + (n.status === "done" ? " done" : "") + (isDraft ? " draft" : "") + (n.id && n.id === activeNote ? " active" : "");
    b.style.left = pct(n.x); b.style.top = pct(n.y); b.style.width = pct(n.w); b.style.height = pct(n.h);
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = label;
    b.append(tag); return b;
  }

  function renderNotes() {
    const el = $("notes"); el.textContent = "";
    const mine = notes.filter((n) => n.shot === current);
    $("notesLabel").textContent = mine.length ? "Notes (" + mine.length + ")" : "Notes";
    if (!mine.length) { el.innerHTML = '<div class="msg">Drag on the capture to add the first note.</div>'; return; }
    mine.forEach((n, i) => {
      const card = document.createElement("article");
      card.className = "note" + (n.status === "done" ? " isdone" : "") + (n.id === activeNote ? " active" : "");
      const h = document.createElement("header");
      const num = document.createElement("span"); num.className = "num"; num.textContent = i + 1;
      const st = document.createElement("span"); st.className = "status"; st.textContent = n.status === "done" ? "Done" : "Open";
      h.append(num, st);
      const p = document.createElement("p"); p.textContent = n.text;
      card.append(h, p);
      if (n.reply) { const r = document.createElement("p"); r.className = "reply"; r.textContent = "Claude: " + n.reply; card.append(r); }
      const row = document.createElement("div"); row.className = "row links";
      const tog = document.createElement("button"); tog.type = "button"; tog.textContent = n.status === "done" ? "Reopen" : "Mark done";
      tog.onclick = async () => { await api("POST", "/api/notes/" + n.id, { status: n.status === "done" ? "open" : "done" }); refresh(); };
      const del = document.createElement("button"); del.type = "button"; del.textContent = "Delete";
      del.onclick = async () => { await api("DELETE", "/api/notes/" + n.id); refresh(); };
      row.append(tog, del); card.append(row);
      card.onmouseenter = () => { activeNote = n.id; renderStage(); };
      card.onmouseleave = () => { activeNote = null; renderStage(); };
      el.append(card);
    });
  }

  function renderAll() { renderShots(); renderStage(); renderNotes(); }

  async function refresh() {
    try {
      [shots, notes] = await Promise.all([api("GET", "/api/shots"), api("GET", "/api/notes")]);
      if (!shots.some((s) => s.id === current)) current = shots[0] && shots[0].id;
      renderAll();
    } catch (e) { $("shots").innerHTML = '<div class="msg">The notes server isn\'t answering. Start it with <code>python tools/cockpit_notes/server.py</code>.</div>'; }
  }

  const canvas = $("canvas"); let start = null;
  const point = (e) => { const r = canvas.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };
  canvas.addEventListener("pointerdown", (e) => { if (showTftc) return; start = point(e); canvas.setPointerCapture(e.pointerId); draft = { x: start.x, y: start.y, w: 0, h: 0 }; renderStage(); });
  canvas.addEventListener("pointermove", (e) => { if (!start) return; const p = point(e); draft = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) }; renderStage(); });
  canvas.addEventListener("pointerup", () => {
    if (!start) return; start = null;
    if (draft && (draft.w < 0.006 || draft.h < 0.006)) draft = { x: Math.max(0, draft.x - 0.02), y: Math.max(0, draft.y - 0.03), w: 0.04, h: 0.06 };
    renderStage(); $("text").focus();
  });
  $("cancel").onclick = () => { draft = null; $("text").value = ""; renderStage(); };
  $("save").onclick = async () => {
    const text = $("text").value.trim();
    if (!draft || !text) { $("saveMsg").textContent = "Write what's wrong first."; return; }
    $("save").disabled = true;
    try { await api("POST", "/api/notes", { shot: current, ...draft, text }); draft = null; $("text").value = ""; $("saveMsg").textContent = "Saved."; }
    catch (e) { $("saveMsg").textContent = "Couldn't save: is the server running?"; }
    $("save").disabled = false; refresh();
  };
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("save").click(); });
  $("recapture").onclick = async () => { $("saveMsg").textContent = ""; try { await api("POST", "/api/capture/" + current); } catch (e) {} refresh(); };
  const setView = (tftc) => { showTftc = tftc; draft = null; $("showOurs").setAttribute("aria-pressed", String(!tftc)); $("showTftc").setAttribute("aria-pressed", String(tftc)); renderStage(); };
  $("showOurs").onclick = () => setView(false);
  $("showTftc").onclick = () => setView(true);

  refresh();
  setInterval(() => { if (!start && !draft) refresh(); }, 3000);
})();
</script>
</body>
</html>
